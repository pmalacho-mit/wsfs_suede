[pytest]
testpaths = tests
# test modules are named after the module they cover, so collect every module
# under testpaths rather than pytest's default test_*.py / *_test.py
python_files = *.py
# `release` and the vendored sqlmodel utilities are importable from the repo root
pythonpath = .
addopts = -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
